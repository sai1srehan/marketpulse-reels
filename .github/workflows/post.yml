name: Telugu story Reel

on:
  push:
    paths:
      - "inbox/**"
  schedule:
    # a reel every 3 hours (05:30, 08:30, 11:30, 14:30, 17:30, 20:30, 23:30, 02:30 IST).
    # The 11:30 / 17:30 / 20:30 IST runs (ANIMATED_HOURS_UTC = 6,12,15) make animated stories on the Kaggle GPU and post
    # ~75 min later (about 12:45 PM, 6:45 PM, 9:45 PM IST, peak hours); the other runs post a trending fact reel in ~10 min.
    # 3 animated a day stays inside Kaggle's free 30 GPU hours a week.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the video only, do NOT post to Instagram"
        type: boolean
        default: true
      format:
        description: "auto = by time slot; animated = Kaggle story; trending = 'మీకు తెలుసా?' trending fact reel"
        type: choice
        options: [auto, animated, trending]
        default: auto

permissions:
  contents: write
  issues: write

concurrency:
  group: reel-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 170   # the Kaggle GPU job can take up to ~2 hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg, fonts, Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Build the video
        id: gen
        run: python main.py generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_VIDEOS: ${{ vars.MANUAL_VIDEOS || '0' }}
          MANUAL_PENDING_MAX: ${{ vars.MANUAL_PENDING_MAX || '2' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          OMNI_VIDEOS: ${{ vars.OMNI_VIDEOS || '0' }}
          OMNI_DAILY_LIMIT: ${{ vars.OMNI_DAILY_LIMIT || '2' }}
          OMNI_VOICEOVER: ${{ vars.OMNI_VOICEOVER || '0' }}
          GEMINI_OMNI_MODEL: ${{ vars.GEMINI_OMNI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_STORIES: ${{ vars.AI_STORIES }}
          REQUIRE_CLIPS: ${{ vars.REQUIRE_CLIPS || '0' }}
          # animated shorts are ON by default; works as a repository Variable or a Secret (set to 0 for the old cartoon engine)
          PIXAR_STORIES: ${{ vars.PIXAR_STORIES || secrets.PIXAR_STORIES || '1' }}
          PIXAR_FORMAT: ${{ vars.PIXAR_FORMAT || 'short' }}
          # 1 = post only real animation (skip the run when the free GPU quota is used up); 0 = post moving pictures instead
          SHORT_REQUIRE_MOTION: ${{ vars.SHORT_REQUIRE_MOTION || '1' }}
          REEL_FORMAT: ${{ inputs.format || 'auto' }}
          ANIMATED_HOURS_UTC: ${{ vars.ANIMATED_HOURS_UTC || '6,12,15' }}
          FALLBACK_TRENDING: ${{ vars.FALLBACK_TRENDING || '1' }}
          SHORT_BEATS: ${{ vars.SHORT_BEATS || '4' }}
          SHORT_STEPS: ${{ vars.SHORT_STEPS || '4' }}
          PIXAR_CLIPS: ${{ vars.PIXAR_CLIPS || '0' }}
          PIXAR_CLIP_SECONDS: ${{ vars.PIXAR_CLIP_SECONDS || '10' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          COOLDOWN_DAYS: ${{ vars.COOLDOWN_DAYS || '30' }}
          SHOW_SUBTITLES: ${{ vars.SHOW_SUBTITLES || '0' }}
          SHOW_PROGRESS: ${{ vars.SHOW_PROGRESS || '0' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_MALE: ${{ secrets.ELEVENLABS_VOICE_MALE }}
          ELEVENLABS_VOICE_FEMALE: ${{ secrets.ELEVENLABS_VOICE_FEMALE }}
          IG_GRAPH_HOST: https://graph.facebook.com
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save video for preview
        if: steps.gen.outputs.has_post == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel-preview
          path: out/reel.mp4
          retention-days: 3

      # Instagram must download the video from a public URL. It is pushed to a
      # throw-away "media" branch (history reset every run) so the repo stays small.
      - name: Host video on the media branch
        if: steps.gen.outputs.has_post == 'true'
        run: |
          mkdir /tmp/media
          cp out/reel.mp4 "/tmp/media/${{ steps.gen.outputs.video_name }}"
          cd /tmp/media
          git init -q -b media
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add .
          git commit -q -m "video ${{ steps.gen.outputs.video_name }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q --force origin media

      - name: Publish Reel to Instagram
        if: steps.gen.outputs.has_post == 'true'
        run: python main.py publish
        env:
          IG_GRAPH_HOST: https://graph.facebook.com
          MEDIA_BRANCH: media
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}

      - name: Save bot memory (ideas, posted stories, inbox)
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add -A state
          for d in inbox ideas; do if [ -d $d ]; then git add -A $d; fi; done
          git diff --cached --quiet || (git commit -m "Update bot state" && git pull --rebase -q && git push -q)
