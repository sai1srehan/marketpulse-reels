name: Telugu story Reel

on:
  schedule:
    # 13:30 UTC = 19:00 IST, once a day (5 stories = 5 days of fresh content)
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the video only, do NOT post to Instagram"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: reel-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg, fonts, Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Build the video
        id: gen
        run: python main.py generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_STORIES: ${{ vars.AI_STORIES }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_MALE: ${{ secrets.ELEVENLABS_VOICE_MALE }}
          ELEVENLABS_VOICE_FEMALE: ${{ secrets.ELEVENLABS_VOICE_FEMALE }}
          IG_GRAPH_HOST: https://graph.facebook.com
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      # Instagram must download the video from a public URL. It is pushed to a
      # throw-away "media" branch (history reset every run) so the repo stays small.
      - name: Host video on the media branch
        if: steps.gen.outputs.has_post == 'true'
        run: |
          mkdir /tmp/media
          cp out/reel.mp4 "/tmp/media/${{ steps.gen.outputs.video_name }}"
          cd /tmp/media
          git init -q -b media
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add .
          git commit -q -m "video ${{ steps.gen.outputs.video_name }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q --force origin media

      - name: Publish Reel to Instagram
        if: steps.gen.outputs.has_post == 'true'
        run: python main.py publish
        env:
          IG_GRAPH_HOST: https://graph.facebook.com
          MEDIA_BRANCH: media
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}

      - name: Remember posted stories (avoids repeats)
        if: steps.gen.outputs.has_post == 'true'
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || (git commit -m "Update posted headlines" && git pull --rebase -q && git push -q)
