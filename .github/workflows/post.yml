name: Stock news Reel (every 2 hours)

on:
  schedule:
    - cron: "30 2-16/2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the video only, do NOT post to Instagram"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: reel-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg, fonts, Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Build the video
        id: gen
        run: python main.py generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      
      - name: Save video for preview
        if: steps.gen.outputs.has_post == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel-preview
          path: out/reel.mp4
          retention-days: 3
          
      - name: Host video on the media branch
        if: steps.gen.outputs.has_post == 'true'
        run: |
          mkdir /tmp/media
          cp out/reel.mp4 "/tmp/media/${{ steps.gen.outputs.video_name }}"
          cd /tmp/media
          git init -q -b media
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add .
          git commit -q -m "video ${{ steps.gen.outputs.video_name }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q --force origin media

      - name: Publish Reel to Instagram
        if: steps.gen.outputs.has_post == 'true'
        run: python main.py publish
        env:
          MEDIA_BRANCH: media
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}

      - name: Remember posted headlines
        if: steps.gen.outputs.has_post == 'true'
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || (git commit -m "Update posted headlines" && git pull --rebase -q && git push -q)
