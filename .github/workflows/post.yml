name: Telugu story Reel

on:
  push:
    paths:
      - "inbox/**"
  schedule:
    # something every 3 hours (SLOT_PLAN, India time):
    #   05:30 devotional post | 08:30 devotional post | 11:30 Kaggle makes 2 story reels -> reel 1 posts ~1:30 PM
    #   14:30 reel 2 (saved) | 17:30 Kaggle makes 2 more -> reel 3 posts ~7:30 PM | 20:30 reel 4 (saved)
    #   23:30 devotional post | 02:30 devotional post
    # = 4 animated story reels + 4 devotional image posts (month, festival, pooja, foods) a day;
    # 2 Kaggle sessions a day stay inside the free 30 GPU hours a week.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, do NOT post to Instagram"
        type: boolean
        default: true
      format:
        description: "auto = by time slot; animated = 2 Kaggle story reels; queued = post the saved reel; post = devotional image post; factpost = fact image post; trending = fact reel"
        type: choice
        options: [auto, animated, queued, post, factpost, trending]
        default: auto

permissions:
  contents: write
  issues: write

concurrency:
  group: reel-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 170   # the Kaggle GPU job can take up to ~2 hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg, fonts, Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libfribidi0 libraqm0 || sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libfribidi0
          pip install -r requirements.txt

      # the second animated reel of the last Kaggle run waits on the "queue" branch (never committed to main)
      - name: Fetch the saved reel
        run: |
          if git fetch -q origin queue 2>/dev/null; then
            mkdir -p queued
            git show origin/queue:queued/meta.json > queued/meta.json || true
            git show origin/queue:queued/reel.mp4 > queued/reel.mp4 || true
            ls -la queued
          else
            echo "no saved reel"
          fi

      - name: Build the video
        id: gen
        run: python main.py generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_VIDEOS: ${{ vars.MANUAL_VIDEOS || '0' }}
          MANUAL_PENDING_MAX: ${{ vars.MANUAL_PENDING_MAX || '2' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          OMNI_VIDEOS: ${{ vars.OMNI_VIDEOS || '0' }}
          OMNI_DAILY_LIMIT: ${{ vars.OMNI_DAILY_LIMIT || '2' }}
          OMNI_VOICEOVER: ${{ vars.OMNI_VOICEOVER || '0' }}
          GEMINI_OMNI_MODEL: ${{ vars.GEMINI_OMNI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_STORIES: ${{ vars.AI_STORIES }}
          REQUIRE_CLIPS: ${{ vars.REQUIRE_CLIPS || '0' }}
          # animated shorts are ON by default; works as a repository Variable or a Secret (set to 0 for the old cartoon engine)
          PIXAR_STORIES: ${{ vars.PIXAR_STORIES || secrets.PIXAR_STORIES || '1' }}
          PIXAR_FORMAT: ${{ vars.PIXAR_FORMAT || 'short' }}
          # 1 = post only real animation (skip the run when the free GPU quota is used up); 0 = post moving pictures instead
          SHORT_REQUIRE_MOTION: ${{ vars.SHORT_REQUIRE_MOTION || '1' }}
          REEL_FORMAT: ${{ inputs.format || 'auto' }}
          SLOT_PLAN: ${{ vars.SLOT_PLAN }}
          REELS_PER_RUN: ${{ vars.REELS_PER_RUN || '2' }}
          FALLBACK_POST: ${{ vars.FALLBACK_POST || '1' }}
          SHORT_BEATS: ${{ vars.SHORT_BEATS || '4' }}
          SHORT_STEPS: ${{ vars.SHORT_STEPS || '4' }}
          PIXAR_CLIPS: ${{ vars.PIXAR_CLIPS || '0' }}
          PIXAR_CLIP_SECONDS: ${{ vars.PIXAR_CLIP_SECONDS || '10' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          COOLDOWN_DAYS: ${{ vars.COOLDOWN_DAYS || '30' }}
          SHOW_SUBTITLES: ${{ vars.SHOW_SUBTITLES || '0' }}
          SHOW_PROGRESS: ${{ vars.SHOW_PROGRESS || '0' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_MALE: ${{ secrets.ELEVENLABS_VOICE_MALE }}
          ELEVENLABS_VOICE_FEMALE: ${{ secrets.ELEVENLABS_VOICE_FEMALE }}
          IG_GRAPH_HOST: https://graph.facebook.com
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save video for preview
        if: steps.gen.outputs.has_post == 'true' || steps.gen.outputs.queue_save == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel-preview
          path: |
            out/reel.mp4
            out/queue/reel.mp4
            out/post/*.jpg
          if-no-files-found: ignore
          retention-days: 3

      # keep the second animated reel for the next "queued" slot
      - name: Save the second reel for later
        if: steps.gen.outputs.queue_save == 'true'
        run: |
          mkdir -p /tmp/queue/queued
          cp out/queue/reel.mp4 out/queue/meta.json /tmp/queue/queued/
          cd /tmp/queue
          git init -q -b queue
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add .
          git commit -q -m "saved reel"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q --force origin queue

      # Instagram must download the video/images from a public URL. They are pushed to a
      # throw-away "media" branch (history reset every run) so the repo stays small.
      - name: Host video on the media branch
        if: steps.gen.outputs.has_post == 'true'
        run: |
          mkdir /tmp/media
          if [ "${{ steps.gen.outputs.post_type }}" = "carousel" ]; then
            cp out/post/*.jpg /tmp/media/
          else
            cp out/reel.mp4 "/tmp/media/${{ steps.gen.outputs.video_name }}"
          fi
          cd /tmp/media
          git init -q -b media
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add .
          git commit -q -m "video ${{ steps.gen.outputs.video_name }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q --force origin media

      - name: Publish Reel to Instagram
        if: steps.gen.outputs.has_post == 'true'
        run: python main.py publish
        env:
          IG_GRAPH_HOST: https://graph.facebook.com
          MEDIA_BRANCH: media
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}

      # the saved reel was posted (or was too old): remove it so it is never posted twice
      - name: Remove the used saved reel
        if: steps.gen.outputs.queue_used == 'true' && success()
        run: git push -q origin --delete queue || true

      - name: Save bot memory (ideas, posted stories, inbox)
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add -A state
          for d in inbox ideas; do if [ -d $d ]; then git add -A $d; fi; done
          git diff --cached --quiet || (git commit -m "Update bot state" && git pull --rebase -q && git push -q)
